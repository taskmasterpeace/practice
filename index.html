<meta name="mobile-web-app-capable" content="yes">

</head><body>
<title>Caribbean Map Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a sea-chart game board. Map is the hero; a side "ship's log" panel holds the task. Single bright theme by choice. */
:root{
  color-scheme: light;
  --sea:#bfe6ec; --sea-deep:#0b4f6c; --sea-mid:#1f7a96;
  --foam:#eef8f8; --card:#ffffff; --ink:#123341; --muted:#557584;
  --sand:#efe2c0; --sand-edge:#c9b68a; --land:#f7efd9; --border:#c7dfe3;
  --go:#1f9d5c; --go-soft:#d6f3e3; --miss:#d64541; --miss-soft:#fde2e0;
  --sun:#ffbf3c; --coral:#f26b4f;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--foam);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--sea-deep);color:#fff;border-radius:18px;padding:12px 18px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:auto -20px -26px -20px;height:40px;
  background:radial-gradient(circle at 20px -6px,transparent 18px,rgba(255,255,255,.08) 19px) 0 0/40px 40px repeat-x}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--display);font-size:clamp(1.4rem,3.4vw,2rem);line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:#cdeaf0;font-size:.9rem}
.tally{display:flex;align-items:center;gap:10px}
.starbox{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:1.15rem;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.iconbtn{background:rgba(255,255,255,.12);border:0;border-radius:999px;width:40px;height:40px;display:grid;place-items:center;transition:background .2s}
.iconbtn:hover{background:rgba(255,255,255,.24)}

/* mode tabs */
.modes{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:560px){.modes{gap:6px}.mode{padding:7px 12px;font-size:.88rem}.mode .ic{display:none}}
.mode{flex:none;display:flex;align-items:center;gap:8px;border:2px solid var(--border);background:var(--card);
  border-radius:999px;padding:8px 14px 8px 10px;font-weight:800;transition:all .2s;white-space:nowrap}
.mode:hover{border-color:var(--sea-mid);transform:translateY(-1px)}
.mode[aria-pressed="true"]{background:var(--sea-mid);border-color:var(--sea-mid);color:#fff}
.mode .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--foam);color:var(--sea-mid)}
.mode[aria-pressed="true"] .ic{background:rgba(255,255,255,.2);color:#fff}
.mode .ms{font-size:.8rem;color:var(--sun);letter-spacing:1px}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
.board{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:10px;min-width:0;position:relative}
.panel{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--display);font-size:1.5rem;line-height:1.1;margin:0;text-wrap:balance}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.howto{color:var(--muted);margin:0;font-size:.95rem}

/* map */
html,body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
@media (min-width:861px){.map{max-height:calc(100dvh - 200px)}}
@media (pointer:coarse){.opt{padding:14px 16px}.mode{min-height:46px}}
.map{display:block;width:100%;height:auto;border-radius:12px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.map .ctx{fill:var(--land);stroke:var(--sand-edge);stroke-width:1}
.map .c{fill:var(--sand);stroke:#8c7a4f;stroke-width:1.4;transition:fill .2s;cursor:pointer}
.map .c:hover,.map .c.hover{fill:#ffe08a}
.map.colored .c{stroke:#5b4a26}
.map .c.ok{fill:#7fd6a4!important}
.map .c.bad{fill:#f4a19b!important}
.map .c.sel{fill:#ffd35c!important;stroke:#7a5b00;stroke-width:2.2}
.map .c.pulse{animation:pulse 0.8s ease-in-out infinite alternate}
@keyframes pulse{from{fill:#ffd35c}to{fill:#ff9f43}}
.map .hit{fill:transparent;cursor:pointer}
.map .ring{fill:none;stroke:#8c7a4f;stroke-width:1.5;stroke-dasharray:4 4;pointer-events:none}
.map .sea-lbl{font-family:var(--body);font-style:italic;font-weight:700;fill:#3d8aa1;font-size:19px;letter-spacing:.18em;text-transform:uppercase;pointer-events:none}
.map .ctx-lbl{font-family:var(--body);font-weight:700;fill:#a3946b;font-size:15px;pointer-events:none}
.map .tag rect{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.map .tag text{font-family:var(--display);font-weight:700;font-size:19px;fill:var(--ink)}
.map .tag.ok rect{fill:var(--go-soft);stroke:var(--go)}
.map .tag line{stroke:var(--ink);stroke-width:1.4}
.map .dot{fill:#fff;stroke:var(--sea-deep);stroke-width:3;cursor:pointer}
.map .dot.tgt{fill:var(--sun)}
.map .pop{animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.map .tag{transform-box:fill-box;transform-origin:center}

/* chips / buttons */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px dashed #8c7a4f;background:#fffaf0;border-radius:10px;padding:8px 12px;font-family:var(--display);font-weight:700;font-size:1.05rem;touch-action:none;transition:transform .15s,background .15s}
.chip:hover{transform:translateY(-2px)}
.chip.sel{background:var(--sun);border-style:solid;border-color:#7a5b00}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);box-shadow:4px 6px 0 rgba(0,0,0,.18)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:var(--sea-mid);color:#fff;transition:filter .2s,transform .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghosty{background:var(--foam);color:var(--sea-deep);border:2px solid var(--border)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--border);background:var(--card);border-radius:14px;padding:12px 14px;
  font-family:var(--display);font-weight:700;font-size:1.25rem;text-align:left;transition:all .18s}
.opt:hover{border-color:var(--sea-mid);transform:translateX(3px)}
.opt.ok{background:var(--go-soft);border-color:var(--go)}
.opt.bad{background:var(--miss-soft);border-color:var(--miss)}
.opt[disabled]{cursor:default}
.opt img{width:72px;height:54px;object-fit:cover;border-radius:6px;border:1px solid #0002;flex:none}
.flagopts{grid-template-columns:repeat(3,1fr)}
.flagopts .opt{flex-direction:column;padding:10px}
.flagopts .opt img{width:100%;height:auto;aspect-ratio:4/3}

/* info card (learn) */
.flagplate{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-width:100%;border:2px solid #0001;background:#eee}
.flagplate img{width:100%;height:100%;object-fit:cover;display:block}
.flagplate .nm{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;background:linear-gradient(transparent,rgba(5,30,40,.82));
  color:#fff;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.facts dt{font-weight:800;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.facts dd{margin:0;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.85rem}
.badge.island{background:#d8f1f7;color:#0b5b73}
.badge.ca{background:#e5f4d6;color:#3f6b14}
.funfact{background:#fff6dc;border:2px solid #f3d98a;border-radius:12px;padding:10px 12px;font-weight:700}

/* progress */
.prog{display:flex;gap:6px;flex-wrap:wrap}
.prog i{width:22px;height:22px;border-radius:50%;background:var(--foam);border:2px solid var(--border);display:grid;place-items:center;font-style:normal;font-size:.75rem;font-weight:800}
.prog i.ok{background:var(--go);border-color:var(--go);color:#fff}
.prog i.bad{background:var(--coral);border-color:var(--coral);color:#fff}
.prog i.now{border-color:var(--sea-mid);border-width:3px}
.prompt{display:flex;align-items:center;gap:12px;background:var(--foam);border-radius:14px;padding:10px 12px}
.prompt img{width:78px;border-radius:6px;border:1px solid #0002;flex:none}
.prompt .big{font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1.05}
.feedback{min-height:1.6em;font-weight:800;font-size:1.05rem}
.feedback.ok{color:var(--go)} .feedback.bad{color:var(--miss)}

/* card stage (no map) */
.cardstage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px;min-height:380px}
.bigflag{width:min(100%,420px);border-radius:14px;border:2px solid #0002;box-shadow:0 10px 0 #0b4f6c22}
.shape{width:min(100%,460px);height:auto;max-height:340px}
.shape path{fill:var(--sea-mid);stroke:var(--sea-deep);stroke-width:1.5;vector-effect:non-scaling-stroke}
.qtext{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,3.4vw,2rem);text-align:center;line-height:1.15;text-wrap:balance;max-width:28ch}
.namebig{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.2rem);line-height:1}

/* spell */
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slot{width:clamp(30px,6vw,46px);height:clamp(40px,7.5vw,56px);border-bottom:4px solid var(--sea-mid);display:grid;place-items:center;
  font-family:var(--display);font-size:clamp(1.3rem,4vw,2rem);font-weight:800;text-transform:uppercase}
.slot.gap{border:0;width:16px}
.slot.filled{color:var(--go);border-color:var(--go)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.tile{width:clamp(40px,9vw,54px);height:clamp(40px,9vw,54px);border-radius:12px;border:0;background:var(--sun);
  box-shadow:0 5px 0 #c98c0b;font-family:var(--display);font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;text-transform:uppercase;transition:transform .1s}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #c98c0b}
.tile.used{visibility:hidden}
.tile.hint{background:#7fd6a4;box-shadow:0 5px 0 #2f8a58}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* results */
.result{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px 12px}
.result .stars{display:flex;gap:8px}
.result .stars svg{width:56px;height:56px}
.result .stars .on{animation:pop .45s cubic-bezier(.3,1.6,.6,1) backwards}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

.foot{color:var(--muted);font-size:.85rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#1f7a96"/><path d="M10 30c4-2 7-1 10 1s7 2 10-1 6-3 8-1" stroke="#bfe6ec" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M16 21c3-6 9-8 13-5 2 2 1 5-2 6-4 1-8 1-11-1z" fill="#ffbf3c"/><circle cx="33" cy="14" r="3" fill="#f26b4f"/></svg>
      <div><h1>Caribbean Map Quest</h1><p>Practice · 9 countries · islands &amp; Central America</p></div>

      <button class="iconbtn" id="soundBtn" aria-label="Sound on" title="Sound"></button>
    </div>
  </header>

  <nav class="modes" id="modes" aria-label="Games"></nav>
  <main id="main"></main>
  <p class="foot">Tip for grown-ups: start with <b>Explore</b>, then <b>Find It</b> and <b>Label the Map</b>. Stars save on this device.</p>
</div>

// ---------- sound ----------
let actx=null;
function tone(freqs,dur=.12,type='sine',vol=.18){
  if(!saved.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(vol,t+i*dur);g.gain.exponentialRampToValueAtTime(.001,t+i*dur+dur*1.6);
      o.connect(g).connect(actx.destination);o.start(t+i*dur);o.stop(t+i*dur+dur*1.7);});
  }catch(e){}
}

const starCount = n=>n>=9?3:n>=7?2:n>=4?1:0;

function mapSVG({colored=false,dots=false}={}){
  const ctx = Object.entries(MAP.ctx).map(([k,d])=>`<path class="ctx" d="${d}"/>`).join('');
  const lands = C.map(c=>`<path class="c" data-k="${c.k}" d="${MAP.main[c.k].d}" ${colored?`style="fill:${c.color}"`:''}><title>${colored?c.name:'?'}</title></path>`).join('');
  const jm = MAP.main.JM.c, sv = MAP.main.SV.c;
  const hits = `<circle class="hit" data-k="JM" cx="${jm[0]}" cy="${jm[1]}" r="38"/><circle class="ring" cx="${jm[0]}" cy="${jm[1]}" r="38"/>`;
  const dotEls = dots ? C.map(c=>{const [x,y]=MAP.main[c.k].c;return `<circle class="dot" data-k="${c.k}" cx="${x}" cy="${y}" r="9"/>`}).join('') : '';
  return `<svg class="map ${colored?'colored':''}" viewBox="0 0 ${MAP.W} ${MAP.H}" role="img" aria-label="Map of Central America and the Caribbean">
  <defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdeef2"/><stop offset="1" stop-color="#a9dbe4"/></linearGradient>
  <pattern id="waves" width="60" height="30" patternUnits="userSpaceOnUse"><path d="M0 15q15-8 30 0t30 0" stroke="#ffffff" stroke-opacity=".35" fill="none" stroke-width="1.5"/></pattern></defs>
  <rect width="${MAP.W}" height="${MAP.H}" fill="url(#sea)"/><rect width="${MAP.W}" height="${MAP.H}" fill="url(#waves)"/>
  <text class="sea-lbl" x="30" y="50">Gulf of Mexico</text>
  <text class="sea-lbl" x="660" y="380">Caribbean Sea</text>
  <text class="sea-lbl" x="30" y="492">Pacific Ocean</text>
  <text class="sea-lbl" x="985" y="40" text-anchor="end">Atlantic Ocean</text>
  ${ctx}
  <text class="ctx-lbl" x="40" y="200">MEXICO</text>
  <text class="ctx-lbl" x="226" y="262">Belize</text>
  <text class="ctx-lbl" x="722" y="200">Haiti</text>
  <text class="ctx-lbl" x="905" y="214">Puerto Rico</text>
  <text class="ctx-lbl" x="700" y="560">COLOMBIA</text>
  <text class="ctx-lbl" x="880" y="470">VENEZUELA</text>
  ${lands}${hits}${dotEls}
  <g transform="translate(940,540)" aria-hidden="true"><circle r="34" fill="#fff" fill-opacity=".7" stroke="#3d8aa1"/><path d="M0-28L6 0 0 28-6 0z" fill="#0b4f6c"/><path d="M-28 0L0-6 28 0 0 6z" fill="#3d8aa1"/>
  <text y="-36" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="16" fill="#0b4f6c">N</text></g>
  <g class="tags"></g>
  </svg>`;
}
function addTag(svg,k,cls='',withLine=true){
  const g = svg.querySelector('.tags');
  const [tx,ty] = TAG[k], [cx,cy] = MAP.main[k].c, name = BY[k].name;
  const w = name.length*10.5+22;
  const ns='http://www.w3.org/2000/svg', el=document.createElementNS(ns,'g');
  el.setAttribute('class','tag pop '+cls);
  el.innerHTML = `${withLine?`<line x1="${cx}" y1="${cy}" x2="${tx}" y2="${ty}"/>`:''}<rect x="${tx-w/2}" y="${ty-15}" width="${w}" height="30" rx="8"/><text x="${tx}" y="${ty+6}" text-anchor="middle">${name}</text>`;
  g.appendChild(el);
}
function countryAt(x,y){
  const el = document.elementFromPoint(x,y);
  return el && el.closest('[data-k]') ? el.closest('[data-k]').dataset.k : null;
}

// ---------- tabs ----------
let mode = 'learn';
try{ if(location.hash && MODES.some(m=>'#'+m.id===location.hash)) mode = location.hash.slice(1);}catch(e){}
function renderTabs(){
  const nav = document.getElementById('modes');
  nav.innerHTML = MODES.map(m=>{const s=saved.stars[m.id]||0;return `<button class="mode" data-m="${m.id}" aria-pressed="${m.id===mode}"><span class="ic">${ico(m.icon)}</span>${m.name}<span class="ms" aria-label="${s} stars">${'★'.repeat(s)}</span></button>`}).join('');
  nav.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{sTap();go(b.dataset.m);});
  document.getElementById('starTotal').textContent = Object.values(saved.stars).reduce((a,b)=>a+b,0);
}
function go(m){ mode=m; try{history.replaceState(null,'','#'+m);}catch(e){} renderTabs(); clearGhost(); (GAMES[m])(); }

// ---------- results ----------
function finish(modeId,score,total,again){
  const st = modeId==='learn'?3:starCount(Math.round(score*9/total));
  setStars(modeId,st);
  if(st>=1) sWin();
  if(st>=2) confetti();
  const next = MODES[(MODES.findIndex(m=>m.id===modeId)+1)%MODES.length];
  const cheer = st===3?'Perfect! You are a map master!':st===2?'Great job! Almost perfect.':st===1?'Nice work! Try again for more stars.':'Good practice! Play again to earn a star.';
  return `<div class="result"><div class="eyebrow">Round complete</div>
    <div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.15}s;display:inline-block">${STAR(i<st)}</span>`).join('')}</div>
    <h2 style="font-family:var(--display);font-size:2rem;margin:0">${score} / ${total}</h2>
    <p style="margin:0;font-weight:700">${cheer}</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn ghosty" id="nextg">Next: ${next.name}</button></div></div>`;
}
function wireFinish(again,modeId){
  $('#again').onclick=()=>{sTap();again();};
  const next = MODES[(MODES.findIndex(m=>m.id===modeId)+1)%MODES.length];
  $('#nextg').onclick=()=>{sTap();go(next.id);};
}

// ---------- 1. Explore ----------
function learn(){
  const seen = new Set();
  main.innerHTML = `<div class="stage"><div class="board">${mapSVG({colored:true})}</div>
   <aside class="panel" id="lp"></aside></div>`;
  const svg = $('.map',main), lp = $('#lp');
  const intro = ()=>{lp.innerHTML = `<div class="eyebrow">Explore</div><h2>Tap a country to meet it</h2>
    <p class="howto">Every colored country is one to learn. Tap each one to see its flag, its capital city, and a fun fact.</p>
    <div class="prog" id="lprog">${C.map(c=>`<i title="${c.name}"></i>`).join('')}</div>
    <div class="row"><button class="btn ghosty" id="showall">Show all names</button></div>`; paintProg(); $('#showall').onclick=showAll;};
  function paintProg(){ const p=$('#lprog'); if(p) [...p.children].forEach((i,n)=>i.classList.toggle('ok',seen.has(C[n].k))); }
  function showAll(){ svg.querySelector('.tags').innerHTML=''; C.forEach(c=>addTag(svg,c.k)); }
  function open(k){
    const c = BY[k]; seen.add(k); sTap();
    svg.querySelectorAll('.c').forEach(p=>p.classList.toggle('sel',p.dataset.k===k));
    lp.innerHTML = `<div class="flagplate"><img src="${flag(k)}" alt="Flag of ${c.name}"><div class="nm">${c.name}</div></div>
      <div><span class="badge ${c.type==='island'?'island':'ca'}">${c.type==='island'?'Caribbean island':'Central America'}</span></div>
      <dl class="facts"><dt>Capital</dt><dd>${c.capital}</dd><dt>Spell it</dt><dd style="letter-spacing:.12em">${c.name.toUpperCase()}</dd></dl>
      <div class="funfact">${c.fact}</div>
      <div class="prog" id="lprog">${C.map(x=>`<i title="${x.name}"></i>`).join('')}</div>
      <p class="howto" id="lmsg">${seen.size}/9 countries met</p>`;
    paintProg();
    if(seen.size===9 && !learn.done){ learn.done=true; setStars('learn',3); sWin(); confetti(); $('#lmsg').innerHTML='<b style="color:var(--go)">You met all 9 countries! ★★★</b> Now try <b>Find It</b>.'; }
  }
  learn.done=false;
  svg.addEventListener('click',e=>{const t=e.target.closest('[data-k]'); if(t) open(t.dataset.k);});
  intro();
}

// ---------- 2. Find It ----------
function find(){
  const order = shuffle(C.map(c=>c.k)); let i=0, score=0, tries=0; const res=[];
  main.innerHTML = `<div class="stage"><div class="board">${mapSVG()}</div><aside class="panel" id="fp"></aside></div>`;
  const svg=$('.map',main), fp=$('#fp');
  function ask(){
    if(i>=order.length){ fp.innerHTML = finish('find',score,9); wireFinish(find,'find'); return; }
    tries=0; const k=order[i];
    fp.innerHTML = `<div class="eyebrow">Find it · ${i+1} of 9</div>
      <div class="prompt"><img src="${flag(k)}" alt=""><div><div class="howto">Tap this country:</div><div class="big">${BY[k].name}</div></div></div>
      <div class="feedback" id="fb"></div>
      <div class="prog">${order.map((x,n)=>`<i class="${res[n]===true?'ok':res[n]===false?'bad':''} ${n===i?'now':''}"></i>`).join('')}</div>
      <p class="howto">Small islands have a dotted circle around them so they are easy to tap.</p>`;
  }
  svg.addEventListener('click',e=>{
    const t=e.target.closest('[data-k]'); if(!t||i>=order.length) return;
    const k=t.dataset.k, want=order[i], fb=$('#fb');
    if(svg.querySelector(`.c.ok[data-k="${k}"]`)) return;
    if(k===want){
      sGood(); svg.querySelector(`.c[data-k="${k}"]`).classList.remove('pulse');
      svg.querySelector(`.c[data-k="${k}"]`).classList.add('ok'); addTag(svg,k,'ok');
      if(tries===0) score++; res[i]=tries===0; fb.className='feedback ok'; fb.textContent= tries===0?'Yes! That is '+BY[k].name+'.':'There it is!';
      i++; setTimeout(ask,850);
    } else {
      sBad(); tries++; const p=svg.querySelector(`.c[data-k="${k}"]`); p.classList.add('bad'); setTimeout(()=>p.classList.remove('bad'),700);
      fb.className='feedback bad'; fb.textContent = `That is ${BY[k].name}. Try again!`;
      if(tries>=2){ svg.querySelector(`.c[data-k="${want}"]`).classList.add('pulse'); fb.textContent=`That is ${BY[k].name}. Look for the blinking one!`; }
    }
  });
  ask();
}

// ---------- 3. Label the map (cut & paste) ----------
let ghostEl=null; function clearGhost(){ if(ghostEl){ghostEl.remove();ghostEl=null;} }
function label(){
  let mistakes=0, placed=0, sel=null;
  main.innerHTML = `<div class="stage"><div class="board">${mapSVG({dots:true})}</div>
    <aside class="panel"><div class="eyebrow">Label the map</div><h2>Put each name where it belongs</h2>
    <p class="howto">Drag a name onto its country. Or tap a name, then tap the country.</p>
    <div class="chips" id="chips">${shuffle(C).map(c=>`<button class="chip" data-n="${c.k}">${c.name}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div></aside></div>`;
  const svg=$('.map',main), fb=$('#fb');
  function tryPlace(chipK, k, chipEl){
    if(!k) return;
    if(svg.querySelector(`.c.ok[data-k="${k}"]`)) return;
    if(chipK===k){
      sGood(); placed++; chipEl.remove(); sel=null;
      svg.querySelector(`.c[data-k="${k}"]`).classList.add('ok');
      const d=svg.querySelector(`.dot[data-k="${k}"]`); if(d) d.remove();
      addTag(svg,k,'ok'); fb.className='feedback ok'; fb.textContent=`Yes! ${BY[k].name} goes there.`;
      svg.querySelectorAll('.c.sel').forEach(p=>p.classList.remove('sel'));
      if(placed===9){ const sc=Math.max(0,9-mistakes); setTimeout(()=>{ $('.panel',main).innerHTML=finish('label',sc,9); wireFinish(label,'label'); },700); }
    } else {
      sBad(); mistakes++; chipEl.classList.add('shake'); setTimeout(()=>chipEl.classList.remove('shake'),400);
      fb.className='feedback bad'; fb.textContent=`Not quite. That spot is not ${BY[chipK].name}.`;
    }
  }
  $('#chips').querySelectorAll('.chip').forEach(ch=>{
    let sx,sy,dragging=false;
    ch.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; dragging=false; ch.setPointerCapture(e.pointerId); });
    ch.addEventListener('pointermove',e=>{
      if(sx==null) return;
      if(!dragging && Math.hypot(e.clientX-sx,e.clientY-sy)>8){ dragging=true; clearGhost(); ghostEl=ch.cloneNode(true); ghostEl.classList.add('ghost','sel'); document.body.appendChild(ghostEl); ch.style.opacity=.35; }
      if(dragging){ ghostEl.style.left=e.clientX+'px'; ghostEl.style.top=e.clientY+'px';
        const k=countryAt(e.clientX,e.clientY); svg.querySelectorAll('.c').forEach(p=>p.classList.toggle('hover',p.dataset.k===k&&!p.classList.contains('ok'))); }
    });
    const end=e=>{
      if(sx==null) return; sx=null; ch.style.opacity='';
      svg.querySelectorAll('.c.hover').forEach(p=>p.classList.remove('hover'));
      if(dragging){ clearGhost(); tryPlace(ch.dataset.n, countryAt(e.clientX,e.clientY), ch); }
      else { sTap(); $('#chips').querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c===ch&&sel!==ch)); sel = sel===ch?null:ch;
        fb.className='feedback'; fb.textContent= sel?`Now tap where ${BY[ch.dataset.n].name} is.`:''; }
    };
    ch.addEventListener('pointerup',end);
    ch.addEventListener('pointercancel',()=>{sx=null;ch.style.opacity='';clearGhost();});
    ch.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();} });
  });
  svg.addEventListener('click',e=>{ const t=e.target.closest('[data-k]'); if(t && sel) tryPlace(sel.dataset.n,t.dataset.k,sel); else if(t && !sel){ fb.className='feedback'; fb.textContent='First pick a name from the list.'; } });
}

// ---------- generic multiple-choice runner ----------
function mcRun(modeId, rounds, render){
  let i=0, score=0;
  main.innerHTML = `<div class="board"><div class="cardstage" id="cs"></div></div>`;
  const cs=$('#cs');
  function step(){
    if(i>=rounds.length){ cs.innerHTML = finish(modeId,score,rounds.length); wireFinish(()=>GAMES[modeId](),modeId); return; }
    const r = rounds[i];
    cs.innerHTML = `<div class="eyebrow">${r.label} · ${i+1} of ${rounds.length}</div>${r.html}<div class="opts ${r.flagOpts?'flagopts':''}" style="width:min(100%,${r.flagOpts?620:460}px)">${r.opts.map((o,n)=>`<button class="opt" data-n="${n}">${o.html}</button>`).join('')}</div><div class="feedback" id="fb"></div>`;
    let first=true;
    cs.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=r.opts[+b.dataset.n], fb=$('#fb');
      if(o.right){ sGood(); b.classList.add('ok'); if(first) score++; fb.className='feedback ok'; fb.innerHTML=r.why||'Correct!';
        cs.querySelectorAll('.opt').forEach(x=>x.disabled=true); i++; setTimeout(step, r.why?1900:1000); }
      else { sBad(); first=false; b.classList.add('bad'); b.disabled=true; fb.className='feedback bad'; fb.textContent=o.no||'Not that one. Try again!'; }
    });
  }
  step();
}

// ---------- 4. Flag match ----------
function flags(){
  const rounds = shuffle(C).map((c,n)=>{
    const wrong = pick(C,2,c);
    const opts = shuffle([c,...wrong]);
    if(n%2===0) return {label:'Whose flag is this?', html:`<img class="bigflag" src="${flag(c.k)}" alt="A flag">`,
      opts:opts.map(o=>({html:o.name,right:o===c,no:`That is not ${o.name}'s flag.`}))};
    return {label:'Pick the right flag', flagOpts:true, html:`<div class="qtext">Which flag belongs to</div><div class="namebig">${c.name}?</div>`,
      opts:opts.map(o=>({html:`<img src="${flag(o.k)}" alt="Flag option">`,right:o===c,no:`That is the flag of ${o.name}.`}))};
  });
  mcRun('flags',rounds);
}

// ---------- 5. Shape detective ----------
function shapes(){
  const rounds = shuffle(C).map(c=>{
    const [[x0,y0],[x1,y1]] = MAP.main[c.k].b, pad=Math.max(x1-x0,y1-y0)*.08;
    return {label:'What country has this shape?',
      html:`<svg class="shape" viewBox="${x0-pad} ${y0-pad} ${x1-x0+pad*2} ${y1-y0+pad*2}" role="img" aria-label="Country outline"><path d="${MAP.main[c.k].d}"/></svg>`,
      why:`Yes! That is <b>${c.name}</b>${c.type==='island'?', an island':''}.`,
      opts:shuffle([c,...pick(C,2,c)]).map(o=>({html:`<img src="${flag(o.k)}" alt="">${o.name}`,right:o===c}))};
  });
  mcRun('shapes',rounds);
}

// ---------- 6. Spell it ----------
function spell(){
  const order = shuffle(C).slice(0,6); let i=0, score=0;
  main.innerHTML = `<div class="board"><div class="cardstage" id="cs"></div></div>`;
  const cs=$('#cs');
  function step(){
    if(i>=order.length){ cs.innerHTML = finish('spell',score,order.length); wireFinish(spell,'spell'); return; }
    const c=order[i], word=c.name.toUpperCase(); let pos=0, miss=0;
    const letters = shuffle([...word].filter(ch=>ch!==' '));
    cs.innerHTML = `<div class="eyebrow">Spell it · ${i+1} of ${order.length}</div>
      <img class="bigflag" style="width:min(100%,220px)" src="${flag(c.k)}" alt="Flag of the country to spell">
      <div class="howto" style="text-align:center">Tap the letters in order to spell this country.</div>
      <div class="slots" id="slots">${[...word].map(ch=>ch===' '?'<span class="slot gap"></span>':'<span class="slot"></span>').join('')}</div>
      <div class="tiles" id="tiles">${letters.map((l,n)=>`<button class="tile" data-l="${l}">${l}</button>`).join('')}</div>
      <div class="row"><button class="btn ghosty" id="hint">Hint</button></div><div class="feedback" id="fb"></div>`;
    const slots=[...cs.querySelectorAll('.slot')];
    const skip=()=>{ while(pos<word.length && word[pos]===' ') pos++; };
    skip();
    cs.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
      if(t.dataset.l===word[pos]){ sTap(); t.classList.add('used'); slots[pos].textContent=word[pos]; slots[pos].classList.add('filled'); pos++; skip();
        cs.querySelectorAll('.tile.hint').forEach(h=>h.classList.remove('hint'));
        if(pos>=word.length){ sGood(); if(miss<=1) score++; $('#fb').className='feedback ok'; $('#fb').textContent=`You spelled ${c.name}!`; i++; setTimeout(step,1100); }
      } else { sBad(); miss++; t.classList.add('shake'); setTimeout(()=>t.classList.remove('shake'),400); $('#fb').className='feedback bad'; $('#fb').textContent='Not the next letter. Look again!'; }
    });
    $('#hint').onclick=()=>{ miss++; const t=[...cs.querySelectorAll('.tile:not(.used)')].find(t=>t.dataset.l===word[pos]); if(t) t.classList.add('hint'); };
  }
  step();
}

// ---------- 7. Quick quiz ----------
const QUIZ = [
  {q:'Cuba is an island in the Caribbean.', a:true, why:'True! Cuba is the biggest island in the Caribbean.'},
  {q:'Guatemala is in Central America.', a:true, why:'True! Guatemala is in Central America, next to Mexico.'},
  {q:'Panama is the farthest north country in Central America.', a:false, why:'False! Panama is the farthest <b>south</b>. It touches South America.'},
  {q:'Jamaica is an island country.', a:true, why:'True! Jamaica is an island south of Cuba.'},
  {q:'The Dominican Republic shares an island with Haiti.', a:true, why:'True! They share the island of Hispaniola.'},
  {q:'Honduras is an island.', a:false, why:'False! Honduras is part of Central America, on the mainland.'},
  {q:'Costa Rica is between Nicaragua and Panama.', a:true, why:'True! Nicaragua is north of it and Panama is south.'},
  {q:'El Salvador is the biggest country in Central America.', a:false, why:'False! El Salvador is the <b>smallest</b>. Nicaragua is the biggest.'},
  {q:'Which country is an island?', o:['Honduras','Cuba','Guatemala'], a:'Cuba'},
  {q:'Which country connects Central America to South America?', o:['Costa Rica','Panama','El Salvador'], a:'Panama'},
  {q:'Which country is known for reggae music?', o:['Jamaica','Nicaragua','Panama'], a:'Jamaica'},
  {q:'Which country is west of Honduras?', o:['Guatemala','Nicaragua','Panama'], a:'Guatemala'},
  {q:'Which country shares an island with Haiti?', o:['Jamaica','Cuba','Dominican Republic'], a:'Dominican Republic'},
  {q:'Which country is south of Honduras?', o:['Nicaragua','Guatemala','Cuba'], a:'Nicaragua'},
  {q:'What is the biggest island in the Caribbean?', o:['Jamaica','Cuba','Panama'], a:'Cuba'},
  {q:'Which country has the Panama Canal?', o:['Panama','Costa Rica','Honduras'], a:'Panama'},
];
function quiz(){
  const rounds = shuffle(QUIZ).slice(0,9).map(x=>{
    if(typeof x.a==='boolean') return {label:'True or false?', html:`<div class="qtext">${x.q}</div>`, why:x.why,
      opts:[{html:'True',right:x.a===true,no:'Not true! Think again.'},{html:'False',right:x.a===false,no:'Hmm, it is actually true!'}]};
    return {label:'Choose the answer', html:`<div class="qtext">${x.q}</div>`, why:`Yes! <b>${x.a}</b>.`,
      opts:shuffle(x.o).map(o=>{const k=C.find(c=>c.name===o).k;return {html:`<img src="${flag(k)}" alt="">${o}`,right:o===x.a,no:`Not ${o}. Try another!`};})};
  });
  mcRun('quiz',rounds);
}

const GAMES = {learn, find, label, flags, shapes, spell, quiz};

// ---------- confetti ----------
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='confetti'; document.body.appendChild(cv);
  const x=cv.getContext('2d'); const W=cv.width=innerWidth, H=cv.height=innerHeight;
  const cols=['#ffbf3c','#f26b4f','#1f9d5c','#1f7a96','#9fd779','#ffd35c'];
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:6+Math.random()*7,c:cols[Math.random()*cols.length|0]}));
  let t=0; (function f(){ x.clearRect(0,0,W,H); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1; x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++t<150) requestAnimationFrame(f); else cv.remove(); })();
}

window.addEventListener('hashchange',()=>{const m=location.hash.slice(1); if(GAMES[m]&&m!==mode) go(m);});
renderTabs(); GAMES[mode]();
