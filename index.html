<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Practice">
<meta name="theme-color" content="#0b4f6c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%231f7a96'/%3E%3Cpath d='M16 21c3-6 9-8 13-5 2 2 1 5-2 6-4 1-8 1-11-1z' fill='%23ffbf3c'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>Map Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a sea-chart game board. Map is the hero; a side "ship's log" panel holds the task. Single bright theme by choice. */
:root{
  color-scheme: light;
  --sea:#bfe6ec; --sea-deep:#0b4f6c; --sea-mid:#1f7a96;
  --foam:#eef8f8; --card:#ffffff; --ink:#123341; --muted:#557584;
  --sand:#efe2c0; --sand-edge:#c9b68a; --land:#f7efd9; --border:#c7dfe3;
  --go:#1f9d5c; --go-soft:#d6f3e3; --miss:#d64541; --miss-soft:#fde2e0;
  --sun:#ffbf3c; --coral:#f26b4f;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--foam);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--sea-deep);color:#fff;border-radius:18px;padding:12px 18px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:auto -20px -26px -20px;height:40px;
  background:radial-gradient(circle at 20px -6px,transparent 18px,rgba(255,255,255,.08) 19px) 0 0/40px 40px repeat-x}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--display);font-size:clamp(1.4rem,3.4vw,2rem);line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:#cdeaf0;font-size:.9rem}
.tally{display:flex;align-items:center;gap:10px}
.starbox{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:1.15rem;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.iconbtn{background:rgba(255,255,255,.12);border:0;border-radius:999px;width:40px;height:40px;display:grid;place-items:center;transition:background .2s}
.iconbtn:hover{background:rgba(255,255,255,.24)}
.playerbtn{background:rgba(255,255,255,.12);border:0;border-radius:999px;height:40px;padding:4px 14px 4px 4px;display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;transition:background .2s;max-width:180px}
.playerbtn:hover{background:rgba(255,255,255,.24)}
.playerbtn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.5rem;line-height:1}
.playerbtn .av{width:32px;height:32px;font-size:1.05rem}
dialog.mq{border:0;border-radius:20px;padding:0;width:min(560px,calc(100vw - 32px));max-width:none;color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.mq::backdrop{background:rgba(11,79,108,.55)}
.mq .hd{background:var(--sea-deep);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mq .hd h2{font-family:var(--display);margin:0;font-size:1.5rem;line-height:1.1}
.mq .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;max-height:72vh;overflow:auto;background:var(--foam)}
.mq .x{background:rgba(255,255,255,.14);border:0;border-radius:999px;width:38px;height:38px;color:#fff;font-size:1.3rem;transition:background .2s}
.mq .x:hover{background:rgba(255,255,255,.28)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.pbtn{border:2px solid var(--border);background:var(--card);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;transition:all .2s;min-width:0}
.pbtn:hover{border-color:var(--sea-mid);transform:translateY(-2px);box-shadow:0 6px 16px rgba(11,79,108,.15)}
.pbtn[aria-pressed="true"]{border-color:var(--go);background:var(--go-soft)}
.pbtn .pn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn .ps{color:#c98c0b;font-size:.9rem}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;font:inherit;font-size:1.1rem;font-weight:700;padding:10px 12px;border:2px solid var(--border);border-radius:12px;background:#fff;color:var(--ink)}
.addrow input:focus{outline:3px solid var(--sun);border-color:var(--sea-mid)}
.mq label.lbl{font-weight:800;font-size:.9rem;color:var(--muted)}
.mq select{font:inherit;font-weight:700;padding:9px 12px;border:2px solid var(--border);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.arcade{background:#0d1b2a;color:#ffe9a8;border-radius:14px;padding:12px 14px;font-family:var(--display);text-align:left;width:100%;max-width:440px;margin:0 auto;box-shadow:inset 0 0 0 3px #1f3b55}
.arcade h3{margin:0 0 6px;text-align:center;letter-spacing:.14em;color:var(--sun);font-size:1.2rem}
.arcade table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:1.05rem}
.arcade td{padding:3px 6px;white-space:nowrap}
.arcade td:nth-child(2){max-width:9em;overflow:hidden;text-overflow:ellipsis}
.arcade td.r{color:#8fb6c4;width:2.4em}
.arcade td.s{text-align:right}
.arcade td.dt{color:#8fb6c4;font-size:.85rem}
.arcade tr.me td{color:#7dffb0}
.arcade .empty{text-align:center;color:#8fb6c4;font-family:var(--body);margin:4px 0}
.newhs{font-family:var(--display);color:var(--coral);font-size:1.5rem;letter-spacing:.06em;animation:hsblink .5s steps(2) 8}
.newhs.small{font-size:1.15rem;color:var(--go)}
.hsnote{margin:0;color:var(--muted);font-size:.92rem}
@keyframes hsblink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.newhs{animation:none}}

/* mode tabs */
.modes{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:560px){.modes{gap:6px}.mode{padding:7px 12px;font-size:.88rem}.mode .ic{display:none}}
.mode{flex:none;display:flex;align-items:center;gap:8px;border:2px solid var(--border);background:var(--card);
  border-radius:999px;padding:8px 14px 8px 10px;font-weight:800;transition:all .2s;white-space:nowrap}
.mode:hover{border-color:var(--sea-mid);transform:translateY(-1px)}
.mode[aria-pressed="true"]{background:var(--sea-mid);border-color:var(--sea-mid);color:#fff}
.mode .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--foam);color:var(--sea-mid)}
.mode[aria-pressed="true"] .ic{background:rgba(255,255,255,.2);color:#fff}
.mode .ms{font-size:.8rem;color:var(--sun);letter-spacing:1px}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
.board{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:10px;min-width:0;position:relative}
.panel{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--display);font-size:1.5rem;line-height:1.1;margin:0;text-wrap:balance}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.howto{color:var(--muted);margin:0;font-size:.95rem}

/* map */
html,body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
@media (min-width:861px){.map{max-height:calc(100dvh - 292px)}}
@media (pointer:coarse){.opt{padding:14px 16px}.mode{min-height:46px}}
.map{display:block;width:100%;height:auto;border-radius:12px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.map .ctx{fill:var(--land);stroke:var(--sand-edge);stroke-width:1}
.map .c{fill:var(--sand);stroke:#8c7a4f;stroke-width:1.4;transition:fill .2s;cursor:pointer}
.map .c:hover,.map .c.hover{fill:#ffe08a}
.map.colored .c{stroke:#5b4a26}
.map .c.ok{fill:#7fd6a4!important}
.map .c.bad{fill:#f4a19b!important}
.map .c.sel{fill:#ffd35c!important;stroke:#7a5b00;stroke-width:2.2}
.map .c.pulse{animation:pulse 0.8s ease-in-out infinite alternate}
@keyframes pulse{from{fill:#ffd35c}to{fill:#ff9f43}}
.map .hit{fill:transparent;cursor:pointer}
.map .ring{fill:none;stroke:#8c7a4f;stroke-width:1.5;stroke-dasharray:4 4;pointer-events:none}
.map .sea-lbl{font-family:var(--body);font-style:italic;font-weight:700;fill:#3d8aa1;font-size:19px;letter-spacing:.18em;text-transform:uppercase;pointer-events:none}
.map .ctx-lbl{font-family:var(--body);font-weight:700;fill:#a3946b;font-size:15px;pointer-events:none}
.map .tag rect{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.map .tag text{font-family:var(--display);font-weight:700;font-size:19px;fill:var(--ink)}
.map .tag.ok rect{fill:var(--go-soft);stroke:var(--go)}
.map .tag line{stroke:var(--ink);stroke-width:1.4}
.map .dot{fill:#fff;stroke:var(--sea-deep);stroke-width:3;cursor:pointer}
.map .dot.tgt{fill:var(--sun)}
.map .pop{animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.map .tag{transform-box:fill-box;transform-origin:center}

/* chips / buttons */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px dashed #8c7a4f;background:#fffaf0;border-radius:10px;padding:8px 12px;font-family:var(--display);font-weight:700;font-size:1.05rem;touch-action:none;transition:transform .15s,background .15s}
.chip:hover{transform:translateY(-2px)}
.chip.sel{background:var(--sun);border-style:solid;border-color:#7a5b00}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);box-shadow:4px 6px 0 rgba(0,0,0,.18)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:var(--sea-mid);color:#fff;transition:filter .2s,transform .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghosty{background:var(--foam);color:var(--sea-deep);border:2px solid var(--border)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--border);background:var(--card);border-radius:14px;padding:12px 14px;
  font-family:var(--display);font-weight:700;font-size:1.25rem;text-align:left;transition:all .18s}
.opt:hover{border-color:var(--sea-mid);transform:translateX(3px)}
.opt.ok{background:var(--go-soft);border-color:var(--go)}
.opt.bad{background:var(--miss-soft);border-color:var(--miss)}
.opt[disabled]{cursor:default}
.opt img{width:72px;height:54px;object-fit:cover;border-radius:6px;border:1px solid #0002;flex:none}
.flagopts{grid-template-columns:repeat(3,1fr)}
.flagopts .opt{flex-direction:column;padding:10px}
.flagopts .opt img{width:100%;height:auto;aspect-ratio:4/3}

/* info card (learn) */
.flagplate{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-width:100%;border:2px solid #0001;background:#eee}
.flagplate img{width:100%;height:100%;object-fit:cover;display:block}
.flagplate .nm{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;background:linear-gradient(transparent,rgba(5,30,40,.82));
  color:#fff;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.facts dt{font-weight:800;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.facts dd{margin:0;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.85rem}
.badge.island{background:#d8f1f7;color:#0b5b73}
.badge.ca{background:#e5f4d6;color:#3f6b14}
.funfact{background:#fff6dc;border:2px solid #f3d98a;border-radius:12px;padding:10px 12px;font-weight:700}

/* progress */
.prog{display:flex;gap:6px;flex-wrap:wrap}
.prog i{width:22px;height:22px;border-radius:50%;background:var(--foam);border:2px solid var(--border);display:grid;place-items:center;font-style:normal;font-size:.75rem;font-weight:800}
.prog i.ok{background:var(--go);border-color:var(--go);color:#fff}
.prog i.bad{background:var(--coral);border-color:var(--coral);color:#fff}
.prog i.now{border-color:var(--sea-mid);border-width:3px}
.prompt{display:flex;align-items:center;gap:12px;background:var(--foam);border-radius:14px;padding:10px 12px}
.prompt img{width:78px;border-radius:6px;border:1px solid #0002;flex:none}
.prompt .big{font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1.05}
.feedback{min-height:1.6em;font-weight:800;font-size:1.05rem}
.feedback.ok{color:var(--go)} .feedback.bad{color:var(--miss)}

/* card stage (no map) */
.cardstage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px;min-height:380px}
.bigflag{width:min(100%,420px);border-radius:14px;border:2px solid #0002;box-shadow:0 10px 0 #0b4f6c22}
.shape{width:min(100%,460px);height:auto;max-height:340px}
.shape path{fill:var(--sea-mid);stroke:var(--sea-deep);stroke-width:1.5;vector-effect:non-scaling-stroke}
.qtext{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,3.4vw,2rem);text-align:center;line-height:1.15;text-wrap:balance;max-width:28ch}
.namebig{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.2rem);line-height:1}

/* spell */
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slot{width:clamp(30px,6vw,46px);height:clamp(40px,7.5vw,56px);border-bottom:4px solid var(--sea-mid);display:grid;place-items:center;
  font-family:var(--display);font-size:clamp(1.3rem,4vw,2rem);font-weight:800;text-transform:uppercase}
.slot.gap{border:0;width:16px}
.slot.filled{color:var(--go);border-color:var(--go)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.tile{width:clamp(40px,9vw,54px);height:clamp(40px,9vw,54px);border-radius:12px;border:0;background:var(--sun);
  box-shadow:0 5px 0 #c98c0b;font-family:var(--display);font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;text-transform:uppercase;transition:transform .1s}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #c98c0b}
.tile.used{visibility:hidden}
.tile.hint{background:#7fd6a4;box-shadow:0 5px 0 #2f8a58}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* results */
.result{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px 12px}
.result .stars{display:flex;gap:8px}
.result .stars svg{width:56px;height:56px}
.result .stars .on{animation:pop .45s cubic-bezier(.3,1.6,.6,1) backwards}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

.foot{color:var(--muted);font-size:.85rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>
/* lessons */
.lessons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lesson{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--border);background:var(--card);border-radius:14px;padding:8px 12px;min-width:0;transition:all .2s}
.lesson:hover{border-color:var(--sea-deep);transform:translateY(-1px);box-shadow:0 4px 0 #0b4f6c1f}
.lesson[aria-pressed="true"]{background:var(--sea-deep);border-color:var(--sea-deep);color:#fff}
.lesson .lic{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--foam);color:var(--sea-deep)}
.lesson[aria-pressed="true"] .lic{background:var(--sun);color:#3b2a00}
.lesson .ln{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.1;flex:1;min-width:0}
.lesson .ls{flex:none;font-weight:800;font-size:.85rem;color:#b47a00;font-variant-numeric:tabular-nums}
.lesson[aria-pressed="true"] .ls{color:var(--sun)}
@media (max-width:700px){.lesson{flex-direction:column;align-items:flex-start;gap:4px;padding:8px}.lesson .ln{font-size:.88rem}.lesson .lic{width:30px;height:30px}}
.iconbtn.off{opacity:.55}
/* feature kinds on the map */
.map .nation{fill:var(--sand);stroke:#8c7a4f;stroke-width:1.6}
.map .stateline{fill:none;stroke:#b9a577;stroke-width:.8}
.map .decor-lake{fill:#a9dbe4;stroke:#7fb9c6;stroke-width:.6;pointer-events:none}
.map .c.k-ocean{fill:#bfe6ec;stroke:none}
.map .c.k-ocean:hover,.map .c.k-ocean.hover{fill:#d9f2f5}
.map .c.k-lake{fill:#6db7dd;stroke:#2c7fb0;stroke-width:1.2}
.map .c.k-lake:hover,.map .c.k-lake.hover{fill:#ffe08a}
.map .c.k-range{fill:url(#peaks);stroke:#8a6a3f;stroke-width:1.4;stroke-dasharray:5 4}
.map .c.k-range:hover,.map .c.k-range.hover,.map .c.k-range.sel{fill:url(#peaksHot)!important}
.map .c.k-range.ok{fill:url(#peaksOk)!important;stroke:#17663c}
.map .c.k-range.bad{fill:url(#peaksBad)!important}
.map .c.k-range.pulse{animation:none;fill:url(#peaksHot)!important;stroke:#b45f00;stroke-width:4}
.map .c.k-river{fill:none!important;stroke:#1b6fb8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.map .c.k-river.hover,.map .c.k-river.sel{stroke:#ff9f43!important;stroke-width:8}
.map .c.k-river.ok{stroke:#1f9d5c!important;stroke-width:7}
.map .c.k-river.bad{stroke:#d64541!important;stroke-width:7}
.map .c.k-river.pulse{animation:pulseS .8s ease-in-out infinite alternate}
@keyframes pulseS{from{stroke:#ffd35c;stroke-width:6}to{stroke:#ff7a1a;stroke-width:11}}
.map .hit-line{fill:none;stroke:transparent;stroke-width:34;stroke-linecap:round;pointer-events:stroke;cursor:pointer}
.map-na .ctx{fill:#f3ead2}
/* kind plates and thumbs */
.badge{background:#d8f1f7;color:#0b5b73}
.kindplate{display:grid;place-items:center;aspect-ratio:16/9;color:#fff}
.kindplate .kicon{opacity:.95;transform:translateY(-10px)}
.k-mountain.kindplate,.kthumb.k-mountain{background:linear-gradient(160deg,#c9a36a,#7a5a2e)}
.k-river.kindplate,.kthumb.k-river{background:linear-gradient(160deg,#4aa3df,#1b5e9c)}
.k-lake.kindplate,.kthumb.k-lake{background:linear-gradient(160deg,#7cc8ea,#2c7fb0)}
.k-ocean.kindplate,.kthumb.k-ocean{background:linear-gradient(160deg,#39a0c4,#0b4f6c)}
.kthumb{flex:none;width:72px;height:54px;border-radius:8px;display:grid;place-items:center;color:#fff}
.kthumb.big{width:130px;height:96px;border-radius:14px}
.prompt .kthumb{width:78px;height:58px}
/* hear button */
.hear{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--border);background:var(--foam);color:var(--sea-deep);border-radius:999px;padding:6px 14px 6px 10px;font-weight:800;transition:all .2s}
.hear:hover{border-color:var(--sea-mid);background:#fff;transform:translateY(-1px)}

let actx=null;
function tone(freqs,dur=.12,type='sine',vol=.18){
  if(!saved.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(vol,t+i*dur);g.gain.exponentialRampToValueAtTime(.001,t+i*dur+dur*1.6);
      o.connect(g).connect(actx.destination);o.start(t+i*dur);o.stop(t+i*dur+dur*1.7);});
  }catch(e){}
}

  const cheer = st===3?`Perfect, ${nm}! You are a map master!`:st===2?`Great job, ${nm}! Almost perfect.`:st===1?`Nice work, ${nm}! Try again for more stars.`:`Good practice, ${nm}! Play again to earn a star.`;
  const flash = hs.rank===1 ? '<div class="newhs">NEW HIGH SCORE!</div>' : hs.rank ? `<div class="newhs small">You made the board: #${hs.rank}</div>` : '';
  const note = st<prev ? `Your best here is still ${prev} star${prev>1?'s':''}. Your star count keeps your best round.` : (st>prev && prev>0 ? `New best! Up from ${prev} star${prev>1?'s':''}.` : '');
  say(cheer + (hs.rank===1?' New high score!':''));
  return `<div class="result"><div class="eyebrow">Round complete · ${esc(nm)}</div>${flash}
    <div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.15}s;display:inline-block">${STAR(i<st)}</span>`).join('')}</div>
    <h2 style="font-family:var(--display);font-size:2rem;margin:0">${score} / ${total}</h2>
    <p style="margin:0;font-weight:700">${esc(cheer)}</p>${note?`<p class="hsnote">${note}</p>`:''}
    ${boardHTML(L.id+':'+modeId,hs.id,5)}
    <div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn ghosty" id="nextg">Next: ${nextStop(modeId).label}</button></div></div>`;
}
function wireFinish(again,modeId){ $('#again').onclick=()=>{sTap();again();}; $('#nextg').onclick=()=>{sTap();nextStop(modeId).run();}; }

/* ---------- 1. Explore ---------- */
function plateHTML(it){
  return it.flag ? `<div class="flagplate"><img src="${flag(it)}" alt="Flag of ${it.name}"><div class="nm">${it.name}</div></div>`
    : `<div class="flagplate kindplate k-${it.plate}"><div class="kicon">${ico(it.plate,120)}</div><div class="nm">${it.name}</div></div>`;
}
function learn(){
  const seen = new Set(), n=L.items.length; let done=false;
  main.innerHTML = `<div class="stage"><div class="board">${mapSVG({colored:true})}</div><aside class="panel" id="lp"></aside></div>`;
  const svg = $('.map',main), lp = $('#lp');
  const prog = ()=>`<div class="prog" id="lprog">${L.items.map(c=>`<i title="${c.name}" class="${seen.has(c.k)?'ok':''}"></i>`).join('')}</div>`;
  function showAll(){ svg.querySelector('.tags').innerHTML=''; L.items.forEach(c=>addTag(svg,c.k)); }
  lp.innerHTML = `<div class="eyebrow">Explore</div><h2>Tap the map to meet each place</h2>
    <p class="howto">Tap each colored part of the map. You will see its name, hear it read out loud, and learn a fun fact.</p>${prog()}
    <div class="row"><button class="btn ghosty" id="showall">Show all names</button></div>`;
  $('#showall').onclick=showAll;
  function open(k){
    const c = L.by[k]; seen.add(k); sTap();
    L.items.forEach(i=>mark(svg,i.k,'sel',i.k===k));
    lp.innerHTML = `${plateHTML(c)}
      <div class="row" style="align-items:center"><span class="badge">${c.badge}</span>${hear(c.name+'. '+c.fact)}</div>
      <dl class="facts">${c.rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}<dt>Spell it</dt><dd style="letter-spacing:.1em">${c.name.toUpperCase()}</dd></dl>
      <div class="funfact">${c.fact}</div>${prog()}<p class="howto" id="lmsg">${seen.size} of ${n} found</p>`;
    say(c.name+'. '+c.fact);
    if(seen.size===n && !done){ done=true; setStars('learn',3); sWin(); confetti(); $('#lmsg').innerHTML='<b style="color:var(--go)">You found all '+n+'! ★★★</b> Now try <b>Find It</b>.'; }
  }
  svg.addEventListener('click',e=>{const t=e.target.closest('[data-k]'); if(t) open(t.dataset.k);});
}

/* ---------- 2. Find It ---------- */
function find(){
  const order = shuffle(L.items.map(c=>c.k)), n=order.length; let i=0, score=0, tries=0; const res=[];
  main.innerHTML = `<div class="stage"><div class="board">${mapSVG()}</div><aside class="panel" id="fp"></aside></div>`;
  const svg=$('.map',main), fp=$('#fp');
  function ask(){
    if(i>=n){ fp.innerHTML = finish('find',score,n); wireFinish(find,'find'); return; }
    tries=0; const it=L.by[order[i]];
    fp.innerHTML = `<div class="eyebrow">Find it · ${i+1} of ${n}</div>
      <div class="prompt">${thumb(it)}<div><div class="howto">Tap this on the map:</div><div class="big">${it.name}</div></div></div>
      <div class="row">${hear('Find '+it.name)}</div>
      <div class="feedback" id="fb"></div>
      <div class="prog">${order.map((x,j)=>`<i class="${res[j]===true?'ok':res[j]===false?'bad':''} ${j===i?'now':''}"></i>`).join('')}</div>
      <p class="howto">Small places have a dotted circle around them so they are easy to tap.</p>`;
    say('Find '+it.name);
  }
  svg.addEventListener('click',e=>{
    const t=e.target.closest('[data-k]'); if(!t||i>=n) return;
    const k=t.dataset.k, want=order[i], fb=$('#fb');
    if(isOk(svg,k)) return;
    if(k===want){
      sGood(); mark(svg,k,'pulse',false); mark(svg,k,'ok'); addTag(svg,k,'ok');
      if(tries===0) score++; res[i]=tries===0; fb.className='feedback ok'; fb.textContent= tries===0?'Yes! That is '+L.by[k].name+'.':'There it is!';
      i++; setTimeout(ask,950);
    } else {
      sBad(); tries++; mark(svg,k,'bad'); setTimeout(()=>mark(svg,k,'bad',false),700);
      fb.className='feedback bad'; fb.textContent = `That is ${L.by[k].name}. Try again!`;
      if(tries>=2){ mark(svg,want,'pulse'); fb.textContent=`That is ${L.by[k].name}. Look for the blinking one!`; }
    }
  });
  ask();
}

/* ---------- 3. Label the map ---------- */
let ghostEl=null; function clearGhost(){ if(ghostEl){ghostEl.remove();ghostEl=null;} }
function label(){
  let mistakes=0, placed=0, sel=null; const n=L.items.length;
  main.innerHTML = `<div class="stage"><div class="board">${mapSVG({dots:true})}</div>
    <aside class="panel"><div class="eyebrow">Label the map</div><h2>Put each name where it belongs</h2>
    <p class="howto">Drag a name onto its spot on the map. Or tap a name, then tap the map.</p>
    <div class="chips" id="chips">${shuffle(L.items).map(c=>`<button class="chip" data-n="${c.k}">${c.name}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div></aside></div>`;
  const svg=$('.map',main), fb=$('#fb');
  function tryPlace(chipK, k, chipEl){
    if(!k || isOk(svg,k)) return;
    if(chipK===k){
      sGood(); placed++; chipEl.remove(); sel=null; mark(svg,k,'ok');
      const d=svg.querySelector(`.dot[data-k="${k}"]`); if(d) d.remove();
      addTag(svg,k,'ok'); fb.className='feedback ok'; fb.textContent=`Yes! ${L.by[k].name} goes there.`;
      if(placed===n){ const sc=Math.max(0,n-mistakes); setTimeout(()=>{ $('.panel',main).innerHTML=finish('label',sc,n); wireFinish(label,'label'); },700); }
    } else {
      sBad(); mistakes++; chipEl.classList.add('shake'); setTimeout(()=>chipEl.classList.remove('shake'),400);
      fb.className='feedback bad'; fb.textContent=`Not quite. That spot is not ${L.by[chipK].name}.`;
    }
  }
  $('#chips').querySelectorAll('.chip').forEach(ch=>{
    let sx=null,sy,dragging=false;
    ch.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; dragging=false; try{ch.setPointerCapture(e.pointerId);}catch(_){} });
    ch.addEventListener('pointermove',e=>{
      if(sx==null) return;
      if(!dragging && Math.hypot(e.clientX-sx,e.clientY-sy)>8){ dragging=true; clearGhost(); ghostEl=ch.cloneNode(true); ghostEl.classList.add('ghost','sel'); document.body.appendChild(ghostEl); ch.style.opacity=.35; }
      if(dragging){ ghostEl.style.left=e.clientX+'px'; ghostEl.style.top=e.clientY+'px';
        const k=keyAt(e.clientX,e.clientY); svg.querySelectorAll('.c').forEach(p=>p.classList.toggle('hover',p.dataset.k===k&&!p.classList.contains('ok'))); }
    });
    ch.addEventListener('pointerup',e=>{
      if(sx==null) return; sx=null; ch.style.opacity='';
      svg.querySelectorAll('.c.hover').forEach(p=>p.classList.remove('hover'));
      if(dragging){ clearGhost(); tryPlace(ch.dataset.n, keyAt(e.clientX,e.clientY), ch); }
      else { sTap(); const was = sel===ch; $('#chips').querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c===ch&&!was)); sel = was?null:ch;
        fb.className='feedback'; fb.textContent= sel?`Now tap where ${L.by[ch.dataset.n].name} is.`:''; if(sel) say(L.by[ch.dataset.n].name); }
    });
    ch.addEventListener('pointercancel',()=>{sx=null;ch.style.opacity='';clearGhost();});
  });
  svg.addEventListener('click',e=>{ const t=e.target.closest('[data-k]'); if(t && sel) tryPlace(sel.dataset.n,t.dataset.k,sel); else if(t && !sel){ fb.className='feedback'; fb.textContent='First pick a name from the list.'; } });
}

/* ---------- multiple-choice runner ---------- */
function mcRun(modeId, rounds){
  let i=0, score=0;
  main.innerHTML = `<div class="board"><div class="cardstage" id="cs"></div></div>`;
  const cs=$('#cs');
  function step(){
    if(i>=rounds.length){ cs.innerHTML = finish(modeId,score,rounds.length); wireFinish(()=>GAMES[modeId](),modeId); return; }
    const r = rounds[i];
    cs.innerHTML = `<div class="eyebrow">${r.label} · ${i+1} of ${rounds.length}</div>${r.html}${r.say?hear(r.say):''}<div class="opts ${r.flagOpts?'flagopts':''}" style="width:min(100%,${r.flagOpts?620:460}px)">${r.opts.map((o,j)=>`<button class="opt" data-n="${j}">${o.html}</button>`).join('')}</div><div class="feedback" id="fb"></div>`;
    if(r.say) say(r.say);
    let first=true;
    cs.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=r.opts[+b.dataset.n], fb=$('#fb');
      if(o.right){ sGood(); b.classList.add('ok'); if(first) score++; fb.className='feedback ok'; fb.innerHTML=r.why||'Correct!'; say(r.why||'Correct!');
        cs.querySelectorAll('.opt').forEach(x=>x.disabled=true); i++; setTimeout(step, r.why?Math.max(1900,plain(r.why).length*75):1000); }
      else { sBad(); first=false; b.classList.add('bad'); b.disabled=true; fb.className='feedback bad'; fb.textContent=o.no||'Not that one. Try again!'; }
    });
  }
  step();
}

/* ---------- 4. Flag match ---------- */
function flags(){
  const C=L.items;
  const rounds = shuffle(C).map((c,j)=>{
    const opts = shuffle([c,...pick(C,2,c)]);
    if(j%2===0) return {label:'Whose flag is this?', say:'Whose flag is this?', html:`<img class="bigflag" src="${flag(c)}" alt="A flag">`, why:`Yes! That is the flag of <b>${c.name}</b>.`,
      opts:opts.map(o=>({html:o.name,right:o===c,no:`That is not ${o.name}'s flag.`}))};
    return {label:'Pick the right flag', say:'Which flag belongs to '+c.name+'?', flagOpts:true, html:`<div class="qtext">Which flag belongs to</div><div class="namebig">${c.name}?</div>`,
      opts:opts.map(o=>({html:`<img src="${flag(o)}" alt="Flag option">`,right:o===c,no:`That is the flag of ${o.name}.`}))};
  });
  mcRun('flags',rounds);
}

/* ---------- 5. Shape detective ---------- */
function shapes(){
  const C=L.items;
  const rounds = shuffle(C).map(c=>{
    const [[x0,y0],[x1,y1]] = L.geo[c.k].b, pad=Math.max(x1-x0,y1-y0)*.08;
    return {label:'What country has this shape?', say:'What country has this shape?',
      html:`<svg class="shape" viewBox="${x0-pad} ${y0-pad} ${x1-x0+pad*2} ${y1-y0+pad*2}" role="img" aria-label="Country outline"><path d="${L.geo[c.k].d}"/></svg>`,
      why:`Yes! That is <b>${c.name}</b>.`,
      opts:shuffle([c,...pick(C,2,c)]).map(o=>({html:`${thumb(o)}${o.name}`,right:o===c}))};
  });
  mcRun('shapes',rounds);
}

/* ---------- 6. Spell it ---------- */
function spell(){
  const order = shuffle(L.items).slice(0,6); let i=0, score=0;
  main.innerHTML = `<div class="board"><div class="cardstage" id="cs"></div></div>`;
  const cs=$('#cs');
  function step(){
    if(i>=order.length){ cs.innerHTML = finish('spell',score,order.length); wireFinish(spell,'spell'); return; }
    const c=order[i], word=c.name.toUpperCase(); let pos=0, miss=0;
    const letters = shuffle([...word].filter(ch=>ch!==' '));
    cs.innerHTML = `<div class="eyebrow">Spell it · ${i+1} of ${order.length}</div>
      ${c.flag?`<img class="bigflag" style="width:min(100%,200px)" src="${flag(c)}" alt="Flag of the place to spell">`:`<span class="kthumb big k-${c.plate}">${ico(c.plate,64)}</span>`}
      <div class="qtext" style="font-size:1.25rem">${c.hint}</div>
      <div class="row" style="justify-content:center">${hear(c.name,'Hear the word')}</div>
      <div class="slots" id="slots">${[...word].map(ch=>ch===' '?'<span class="slot gap"></span>':'<span class="slot"></span>').join('')}</div>
      <div class="tiles" id="tiles">${letters.map(l=>`<button class="tile" data-l="${l}">${l}</button>`).join('')}</div>
      <div class="row"><button class="btn ghosty" id="hint">Show me the next letter</button></div><div class="feedback" id="fb"></div>`;
    say('Spell '+c.name);
    const slots=[...cs.querySelectorAll('.slot')];
    const skip=()=>{ while(pos<word.length && word[pos]===' ') pos++; };
    skip();
    cs.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
      if(t.dataset.l===word[pos]){ sTap(); t.classList.add('used'); slots[pos].textContent=word[pos]; slots[pos].classList.add('filled'); pos++; skip();
        cs.querySelectorAll('.tile.hint').forEach(h=>h.classList.remove('hint'));
        if(pos>=word.length){ sGood(); if(miss<=1) score++; $('#fb').className='feedback ok'; $('#fb').textContent=`You spelled ${c.name}!`; say('You spelled '+c.name+'!'); i++; setTimeout(step,1700); }
      } else { sBad(); miss++; t.classList.add('shake'); setTimeout(()=>t.classList.remove('shake'),400); $('#fb').className='feedback bad'; $('#fb').textContent='Not the next letter. Look again!'; }
    });
    $('#hint').onclick=()=>{ miss++; const t=[...cs.querySelectorAll('.tile:not(.used)')].find(t=>t.dataset.l===word[pos]); if(t) t.classList.add('hint'); };
  }
  step();
}

/* ---------- 7. Quick quiz ---------- */
function quiz(){
  const rounds = shuffle(L.quiz).slice(0,9).map(x=>{
    if(typeof x.a==='boolean') return {label:'True or false?', say:'True or false? '+x.q, html:`<div class="qtext">${x.q}</div>`, why:x.why,
      opts:[{html:'True',right:x.a===true,no:'Not true! Think again.'},{html:'False',right:x.a===false,no:'Hmm, it is actually true!'}]};
    return {label:'Choose the answer', say:x.q, html:`<div class="qtext">${x.q}</div>`, why:`Yes! <b>${x.a}</b>.`,
      opts:shuffle(x.o).map(o=>{const it=L.items.find(c=>c.name===o);return {html:`${thumb(it)}${o}`,right:o===x.a,no:`Not ${o}. Try another!`};})};
  });
  mcRun('quiz',rounds);
}

const GAMES = {learn, find, label, flags, shapes, spell, quiz};

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='confetti'; document.body.appendChild(cv);
  const x=cv.getContext('2d'); const W=cv.width=innerWidth, H=cv.height=innerHeight;
  const cols=['#ffbf3c','#f26b4f','#1f9d5c','#1f7a96','#9fd779','#ffd35c'];
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:6+Math.random()*7,c:cols[Math.random()*cols.length|0]}));
  let t=0; (function f(){ x.clearRect(0,0,W,H); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1; x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++t<150) requestAnimationFrame(f); else cv.remove(); })();
}

window.addEventListener('hashchange',()=>{ const p=parseHash(); if(p&&(p[0]!==L||p[1]!==mode)){ L=p[0]; go(p[1]); } });
/* ---------- players + high scores ---------- */
const whoBtn=document.getElementById('whoBtn'), whoDlg=document.getElementById('whoDlg'), hsDlg=document.getElementById('hsDlg');
const totalOf = p=>Object.values(p.stars||{}).reduce((a,b)=>a+b,0);
function paintWho(){ const n=saved.current; whoBtn.innerHTML = n ? avatar(n)+`<span class="nm">${esc(n)}</span>` : `<span class="av" style="background:var(--sun);color:var(--sea-deep)">?</span><span class="nm">Who's playing?</span>`; }
function pickPlayer(n){ saved.current=n; save(); paintWho(); renderTabs(); try{whoDlg.close();}catch(e){} sTap(); say('Hi '+n+'! Let\'s play.'); }
function openWho(forced){
  const names=Object.keys(saved.players);
  whoDlg.innerHTML=`<div class="hd"><h2>Who's playing?</h2>${forced&&!saved.current?'':'<button class="x" type="button" data-close aria-label="Close">×</button>'}</div>
  <div class="bd">${names.length?`<div class="plist">${names.map(n=>`<button class="pbtn" type="button" data-p="${esc(n)}" aria-pressed="${n===saved.current}">${avatar(n)}<span class="pn">${esc(n)}</span><span class="ps">★ ${totalOf(saved.players[n])}</span></button>`).join('')}</div>`:''}
  <label class="lbl" for="newName">${names.length?'New player':'Type your name to start'}</label>
  <form class="addrow" id="addForm"><input id="newName" maxlength="12" autocomplete="off" autocapitalize="words" placeholder="Your name"><button class="btn" type="submit">Play</button></form></div>`;
  whoDlg.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>pickPlayer(b.dataset.p));
  const c=whoDlg.querySelector('[data-close]'); if(c) c.onclick=()=>whoDlg.close();
  whoDlg.querySelector('#addForm').onsubmit=ev=>{ ev.preventDefault(); const n=whoDlg.querySelector('#newName').value.trim().replace(/\s+/g,' ').slice(0,12);
    if(!n) return; if(!saved.players[n]) saved.players[n]={stars:{}}; pickPlayer(n); };
  whoDlg.oncancel=ev=>{ if(!saved.current) ev.preventDefault(); };
  try{ whoDlg.showModal(); }catch(e){ whoDlg.setAttribute('open',''); }
  if(!names.length) setTimeout(()=>{ try{whoDlg.querySelector('#newName').focus();}catch(e){} },50);
}
const GAMELIST = ()=>LESSONS.flatMap(les=>les.modes.filter(m=>m!=='learn').map(m=>({g:les.id+':'+m, label:les.short+' · '+MODES[m].name})));
function openHS(g){
  const list=GAMELIST(); if(!list.some(x=>x.g===g)) g=(saved.scores.slice().sort((a,b)=>b.d-a.d)[0]||list[0]).g;
  const champs=Object.keys(saved.players).map(n=>({n,t:totalOf(saved.players[n])})).sort((a,b)=>b.t-a.t);
  hsDlg.innerHTML=`<div class="hd"><h2>High Scores</h2><button class="x" type="button" data-close aria-label="Close">×</button></div>
  <div class="bd"><label class="lbl" for="hsGame">Game</label><select id="hsGame">${list.map(x=>`<option value="${x.g}"${x.g===g?' selected':''}>${esc(x.label)}</option>`).join('')}</select>
  <div id="hsBoard">${boardHTML(g)}</div>
  <div class="arcade"><h3>STAR CHAMPS</h3>${champs.length?`<table>${champs.map((x,i)=>`<tr><td class="r">${i+1}.</td><td>${esc(x.n)}</td><td class="s">★ ${x.t}</td></tr>`).join('')}</table>`:'<p class="empty">No players yet.</p>'}</div></div>`;
  hsDlg.querySelector('[data-close]').onclick=()=>hsDlg.close();
  hsDlg.querySelector('#hsGame').onchange=e=>{ hsDlg.querySelector('#hsBoard').innerHTML=boardHTML(e.target.value); };
  try{ hsDlg.showModal(); }catch(e){ hsDlg.setAttribute('open',''); }
}
whoBtn.onclick=()=>{ sTap(); openWho(false); };
document.getElementById('hsBtn').onclick=()=>{ sTap(); openHS(L.id+':'+mode); };
paintWho();
renderTabs(); GAMES[mode]();
if(!saved.current) openWho(true);
</script>
